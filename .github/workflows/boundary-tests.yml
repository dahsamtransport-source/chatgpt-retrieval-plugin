name: Query and upload boundary regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/security/requirements.txt
      - run: python -m pip install -r tests/security/requirements.txt
      - run: python -m pytest tests/security tests/services -q
